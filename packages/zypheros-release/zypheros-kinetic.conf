# Anaconda profile for ZypherOS Kinetic. Anaconda picks a profile by the
# os-release ID and VARIANT_ID; Kinetic inherits Fedora KDE's settings:
# btrfs by default, the "fedora" EFI directory that Fedora's signed shim and
# GRUB use, and user creation left to Plasma Setup on first boot.
[Profile]
profile_id = zypheros-kinetic
base_profile = fedora-kde

[Profile Detection]
os_id = zypheros
variant_id = kinetic
