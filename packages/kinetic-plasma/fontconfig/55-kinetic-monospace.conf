<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ZypherOS Kinetic: JetBrains Mono is the monospace font for every app
     that asks fontconfig for "monospace" (GTK apps, Chromium, VSCodium),
     matching KDE's fixed-width font. Runs before Fedora's Noto Sans Mono
     rule (56), so JetBrains Mono comes first. -->
<fontconfig>
  <match>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend">
      <string>JetBrains Mono</string>
    </edit>
  </match>
</fontconfig>
